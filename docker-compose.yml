services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - '3001:3001'
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    # Перевизначаємо команду саме для режиму розробки з ватчером
    command: >
      sh -c "npx prisma db push && node --watch=src/**/*.js src/index.js"

  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: user_app
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U user -d user_app']
      interval: 3s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
